name: CI

# Unit tests plus a smoke test of the real npm artifact, on every pull request
# and on main after merge. Each job's pass/fail is a status check you can mark
# as required in branch protection, so a red job blocks a merge. The suite is
# pure logic with no network, database, or secrets, so there is nothing to
# provision here.
#
# main is covered too, not just PRs, because we publish from main: a green PR
# that goes red once merged is exactly the state we do not want to ship from.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# One run per branch; a new push cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result, so one failure does not hide the others.
      fail-fast: false
      matrix:
        # 20 is the floor we can exercise: vitest runs on ^20 || ^22 || >=24,
        # while package.json declares engines >=18. The runtime dependencies do
        # support 18, so that claim is not wrong, just not verifiable here.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # npm ci, so the lockfile is authoritative and this fails loudly if it ever
      # drifts out of sync with package.json again. It only works because the
      # lockfile now carries all 32 platform binaries rather than just the six
      # darwin-arm64 ones. npm records only the resolving platform's optional
      # deps, so regenerate from a clean directory (no node_modules present) or
      # the Linux builds of rolldown, lightningcss, and sharp go missing and
      # every job here dies before running a test.
      - run: npm ci --no-audit --no-fund
      - run: npm test

  package:
    name: package
    runs-on: ubuntu-latest
    # The CLI ships as raw ESM with no build step, and `files` ships whole
    # directories. So the thing that breaks is not a stray missing file, it is
    # a new top-level directory that nobody added to `files`: the tarball
    # publishes fine and then dies with a module-not-found on a user's machine
    # the first time it imports something from there. Pack it, install it
    # somewhere clean, and run it the way a user would.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # No npm ci: there is no build or prepack step, so the tarball is built
      # straight from the checkout. Only the consumer install below needs deps,
      # and it pulls them from the registry like a real user does.
      - name: Pack the tarball
        # --pack-destination does not create the directory itself.
        run: |
          mkdir -p /tmp/pack
          npm pack --pack-destination /tmp/pack

      - name: Install it into a clean project
        run: |
          mkdir -p /tmp/consumer
          cd /tmp/consumer
          npm init -y > /dev/null
          npm install /tmp/pack/*.tgz

      # Loads the bin and its import graph out of the installed location, which
      # is a different resolution path than running from the repo.
      - name: Run the installed CLI
        working-directory: /tmp/consumer
        run: |
          ./node_modules/.bin/restless version
          ./node_modules/.bin/restless help > /dev/null

      # readVersion() falls back to the string "unknown" when it cannot read the
      # package.json next to the bin, rather than crashing. That fallback would
      # otherwise be invisible, so compare against the version we declare.
      - name: Check the shipped version is the declared one
        run: |
          shipped="$(/tmp/consumer/node_modules/.bin/restless version)"
          declared="$(node -p 'require("./package.json").version')"
          if [ "$shipped" != "$declared" ]; then
            echo "Installed CLI reports '$shipped' but package.json declares '$declared'"
            exit 1
          fi
          echo "Shipped version: $shipped"
